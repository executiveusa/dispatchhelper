name: SPATCHY Verify

on:
  push:
    branches:
      - main
      - upgrade/crew-shuttle-spatchy-2026-09-24
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes --package=tsx@4.20.6 tsx --test tests/flywheel.test.ts tests/flywheel-safety.test.ts
